<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Preconnect to external origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!-- Critical CSS - needed for initial render (layout + site styles) -->
  <link rel="stylesheet" href="/css/bootstrap-grid.css">
  <link rel="stylesheet" href="/css/style.css">

  <!-- Non-critical CSS - deferred to avoid blocking render -->
  <link rel="stylesheet" href="/css/fa-brands-only.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/css/swiper.min.css" media="print" onload="this.media='all'">

  <!-- Fallback for non-critical CSS when JS is disabled -->
  <noscript>
    <link rel="stylesheet" href="/css/fa-brands-only.min.css">
    <link rel="stylesheet" href="/css/swiper.min.css">
  </noscript>

  <!-- Google Fonts - preload then apply -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" as="style" onload="this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </noscript>

  <title>∅overflow</title>
</head>

<body>
  <div id="root"></div>

  <!-- All JS deferred - executes after HTML parsing, maintains order -->
  <script src="/js/jquery.min.js" defer></script>
  <script src="/js/gsap.min.js" defer></script>
  <script src="/js/ScrollTrigger.min.js" defer></script>
  <script src="/js/swup.min.js" defer></script>
  <script src="/js/swiper.min.js" defer></script>
  <!-- React module (type=module defers automatically) -->
  <script type="module" src="/src/main.jsx"></script>
  <script src="/js/main.js" defer></script>
</body>

</html>
